<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志 · 阅读</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  
  <style>
    /* 覆盖原本的全屏布局，保留全局导航的空间 */
    body { overflow: hidden; background: var(--paper); }
    .blog-layout { margin-left: var(--nav-w); height: 100vh; overflow-y: auto; position: relative; }
    
    /* 顶部悬浮操作栏 */
    .reader-topbar {
      position: fixed; top: 0; right: 0; left: var(--nav-w); height: 70px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 clamp(20px, 5vw, 60px);
      background: linear-gradient(to bottom, var(--paper) 60%, transparent);
      z-index: 100; pointer-events: none;
    }
    .reader-topbar * { pointer-events: auto; }
    
    /* 目录按钮 */
    .btn-index {
      font-family: var(--font-mono); font-size: 12px; font-weight: bold;
      color: var(--ink); border: 1px solid var(--ink); padding: 8px 16px;
      background: transparent; cursor: pointer; transition: all 0.3s;
    }
    .btn-index:hover { background: var(--ink); color: var(--paper); }
    
    /* 阅读进度条 */
    .reading-progress {
      position: fixed; top: 0; left: var(--nav-w); height: 3px; background: var(--red);
      width: 0%; z-index: 101; transition: width 0.1s;
    }

    /* 正文区域 */
    .article-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 120px 24px 120px;
      font-size: 17px;
      line-height: 1.9;
      color: var(--ink2);
    }

    /* 沉浸排版细节 */
    .article-content h1 { font-family: var(--font-display); font-size: clamp(32px, 5vw, 48px); color: var(--ink); margin: 0 0 40px; line-height: 1.2; }
    .article-content h2 { font-family: var(--font-display); font-size: 26px; color: var(--ink); margin: 1.8em 0 1em; border-bottom: 2px solid var(--red); padding-bottom: 8px; }
    .article-content h3 { font-family: var(--font-display); font-size: 20px; color: var(--ink); margin: 1.5em 0 0.8em; }
    .article-content p { margin-bottom: 1.5em; }
    .article-content a { color: var(--red); text-decoration: none; border-bottom: 1px dashed var(--red); }
    .article-content blockquote { border-left: 4px solid var(--red); padding-left: 20px; margin: 2em 0; color: var(--ink3); font-style: italic; font-size: 1.1em; }
    .article-content pre { background: var(--paper-warm); padding: 20px; border-radius: 8px; overflow-x: auto; border: 1px solid rgba(0,0,0,0.1); }
    .article-content code { font-family: var(--font-mono); background: rgba(192,39,28,0.05); padding: 2px 6px; border-radius: 4px; color: var(--red); }
    .article-content pre code { background: none; color: #24292e; }

    /* ===== 核心：全屏毛玻璃目录浮层 ===== */
    .index-overlay {
      position: fixed; inset: 0; left: var(--nav-w); z-index: 200;
      background: rgba(228, 220, 199, 0.85); /* 纸张色 + 透明度 */
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .index-overlay.show { opacity: 1; pointer-events: auto; }
    
    .overlay-inner {
      max-width: 800px; width: 90%; max-height: 70vh; overflow-y: auto;
      padding: 40px;
    }
    
    .overlay-title {
      font-family: var(--font-mono); font-size: 12px; color: var(--red);
      letter-spacing: 0.2em; margin-bottom: 30px; border-bottom: 1px dashed var(--red); padding-bottom: 10px;
    }

    .nav-group { margin-bottom: 30px; }
    .nav-group-title {
      font-family: var(--font-mono); font-size: 13px; color: var(--ink3);
      margin-bottom: 12px; letter-spacing: 0.1em;
    }
    .nav-item {
      display: block; font-family: var(--font-display); font-size: 20px; font-weight: 700;
      color: var(--ink); text-decoration: none; padding: 12px 0;
      border-bottom: 1px solid rgba(23,22,26,0.1);
      transition: all 0.2s; cursor: pointer;
    }
    .nav-item:hover { color: var(--red); padding-left: 10px; }
    .nav-item.active { color: var(--red); }
  </style>
</head>
<body>

  <!-- 全局导航栏 -->
<nav class="sidebar" style="view-transition-name: sidebar;">
  <div class="sidebar-brand">АРХИВ · NO.042</div>
  <div class="sidebar-nav">
    <!-- 无论点哪个，都回 index.html，并带上对应的 target 哈希 -->
    <a href="index.html">首页</a>
    <a href="index.html#archive">档案</a>
    <a href="index.html#works">工程</a>
    <a href="index.html#journal">日志</a>
    <!-- 通讯在你原来的配置里可能也是回首页 -->
    <a href="index.html#contact">通讯</a>
  </div>
  <div class="sidebar-mark"></div>
</nav>

  <!-- 进度条 -->
  <div class="reading-progress" id="progressBar"></div>

  <!-- 顶部栏 -->
  <div class="reader-topbar">
    <div style="font-family: var(--font-mono); font-size: 12px; color: var(--ink3);" id="currentTitle">正在载入...</div>
    <button class="btn-index" id="btnIndex">目录 / INDEX</button>
  </div>

  <!-- 正文 -->
  <div class="blog-layout" id="blogLayout">
    <article class="article-content" id="article-container">
      <div class="loading-text" style="color:var(--red); font-family:var(--font-mono);">正在拉取墨迹...</div>
    </article>
  </div>

  <!-- 目录浮层 -->
  <div class="index-overlay" id="indexOverlay">
    <div class="overlay-inner" id="overlayInner">
      <div class="overlay-title">全部卷宗 / ARCHIVE INDEX</div>
      <div id="navList"></div>
    </div>
  </div>

  <!-- 依赖 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="./js/show_markdown.js"></script>
  <script src="./js/blog.js"></script>
</body>
</html>
